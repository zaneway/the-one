# theone 配置文件
# 使用方式: ./bin/theone serve -config theone.yaml
# 优先级: CLI flag > 环境变量 > 本文件 > 内置默认值

# ── 存储配置 ──────────────────────────────────────────────
storage:
  # 后端类型，当前仅支持 sqlite
  backend: "sqlite"

  # SQLite 数据库文件路径，支持 ~ 展开
  # 环境变量: THEONE_DB_PATH (优先级高于 data-dir)
  #   path: "~/.theone/memory.db"

  # sqlite-vec 向量索引能力探测
  # auto: 自动检测 | true: 强制启用 | false: 强制禁用
  sqlite_vec_enabled: "auto"

  # 写锁等待超时(毫秒)，避免并发写入时请求无限阻塞
  busy_timeout_ms: 1000

# ── 服务配置 ──────────────────────────────────────────────
server:
  # MCP 传输方式，当前仅支持 stdio (通过 stdin/stdout 与 Agent 通信)
  # 环境变量: THEONE_MCP_ADDR
  mcp_addr: "stdio"

# ── 日志配置 ──────────────────────────────────────────────
logging:
  # 日志级别: debug | info | warn | error
  # 环境变量: THEONE_LOG_LEVEL
  level: "info"

  # 日志格式: text (人类可读) | json (机器解析)
  # 日志会同时输出到 stderr 和日志文件
  format: "text"

  # 日志文件路径，支持 ~ 展开
  # 环境变量: THEONE_LOG_PATH
  #   path: "~/.theone/logs/theone.log"

  # serve 启动时清理旧日志文件（仅删除 .log 后缀文件，含子目录）
  # 环境变量: THEONE_LOG_STARTUP_CLEANUP=0|false 可关闭
  startup_cleanup_enabled: true
  # 省略时默认清理 <data-dir>/logs
  # startup_cleanup_dirs:
  #   - ".theone-data/logs"

# ── 记忆配置 ──────────────────────────────────────────────
#  默认身份和工作区，内容边界限制
memory:
  # 默认用户 ID，用于 user_global 作用域的默认值
  default_user_id: "local_default_user"

  # 默认工作空间，用于 scope 过滤
  default_workspace: "local_default_workspace"

  # content 字段最大字符数
  max_content_chars: 20000

  # evidence.interpreted_statement 最大字符数
  max_evidence_chars: 1200

  # keywords 数组最大元素数
  max_keyword_count: 30

  # salient_spans 数组最大元素数
  max_salient_span_count: 10

# ── 接入层（ingest / ExpandMode）──────────────────────────
# theone dogfood 默认 ；回滚设 legacy。环境变量 THEONE_EXPAND_MODE 优先。
adapter:
  expand_mode: v2
  atomic_strip_turn_fields: false
  prefetch_timeout_ms: 3000
  max_inject_chars: 4000
  # beforeSubmitPrompt 写入 prompt-cache 的用户摘要最大字符数
  prompt_cache_user_summary_max_chars: 3000
  # ingest 平面不写 raw_event 的事件类型；省略时使用内置默认
  suppress_raw_event_types:
    - session.start
    - tool.result.summary
    - file.edit.summary

# ── 捕获配置 ──────────────────────────────────────────────
capture:
  # Agent 自动捕获事件是否要求绑定 session
  require_session_for_agent_events: true

  # 兼容旧配置项：input_summary 已不再限制长度
  max_input_summary_chars: 1200

  # 兼容旧配置项：output_summary 已不再限制长度
  max_output_summary_chars: 2000

  # content_summary 字段最大字符数
  max_content_summary_chars: 6000

  # source_refs_json 字段最大字符数
  max_source_refs_chars: 4000

  # raw_payload_json 字段最大字符数；默认 1MiB，尽量保留原始事实
  max_raw_payload_chars: 1048576

  # 单个 salient_span 最大字符数
  max_salient_span_chars: 500

  # salient_spans 数组最大元素数
  max_salient_span_count: 10

  # keywords 数组最大元素数
  max_keyword_count: 30

  # 未指定 agent_type 时的默认值
  default_agent_type: "unknown"

# ── 检索配置 ──────────────────────────────────────────────
# 在线检索默认值， 检索实现会使用这些限制
retrieval:
  # memory.search 默认返回结果数
  default_limit: 10

  # memory.context 默认 token 预算
  default_token_budget: 1800

  # 在线检索超时(毫秒)，外部模型调用不计入此预算
  online_timeout_ms: 100

# ── Embedding / 向量召回配置 ───────────────────────────────
# 默认关闭，关闭时检索链路降级为 FTS + metadata + relation，不调用外部 embedding API。
# 当前 embedding provider 使用 OpenAI-compatible /embeddings API。
# 注意：API key、base_url、timeout 复用 processor.openai 配置；这里仅配置 embedding 自身的开关和模型名。
embedding:
  # embedding 提供者。
  # 可填：
  #   none     : 关闭 embedding，默认值
  #   openai   : 使用 OpenAI-compatible embeddings API
  #   deepseek : 预留别名，当前仍按 OpenAI-compatible 客户端调用
  #   external : 预留外部兼容 provider，当前仍按 OpenAI-compatible 客户端调用
  provider: "openai"

  # embedding 模型名称。
  # provider=none 时留空。
  # provider=openai/deepseek/external 时必填，例如：
  #   text-embedding-3-small
  #   text-embedding-3-large
  #   或兼容服务实际支持的 embedding 模型名
  # 这里不复用 processor.openai.model，因为 chat/completion 模型和 embedding 模型通常不是同一个模型。
  model: "MiniMax-embedding-01"

  # query embedding 进程内 LRU 缓存容量。
  # 用于减少相同 query 重复调用 /embeddings 的次数；必须大于 0。
  query_cache_size: 256

  # 是否在 memory.search / memory.context 时在线生成 query embedding。
  # true 后会调用 processor.openai.base_url + /embeddings，并用 memory_embedding 表做向量召回。
  # 仅打开本项还不够：memory_embedding 表中必须已有同 model 的 memory 向量。
  online_query_embedding_enabled: true

  # 是否在 memory 写入、编辑、approve 后异步生成 memory embedding。
  # true 后会创建 compute_embedding job，由 automation worker 调用同一个 embedding provider 生成 memory 向量。
  # 启用向量召回通常需要同时打开本项和 online_query_embedding_enabled。
  memory_embedding_enabled: true

# ── 保留策略 ──────────────────────────────────────────────
# serve 模式周期性消费 access log，刷新 retention_score 与强化字段。
retention:
  job_enabled: true
  job_interval_ms: 60000
  temporary_ttl_days: 5

# ── 处理器配置 ────────────────────────────────────────────
# 自动 evidence/candidate 抽取 Provider 和内容上限
processor:
  # 处理器提供者：rule_based | openai（二选一）
  # rule_based：evidence + candidate 均本地规则
  # openai：evidence + candidate 均调外部模型
  provider: "openai"

  # Provider 抽取时读取的近邻事件上限
  max_related_events: 20

  # 单个事件最多生成候选记忆数
  max_candidates_per_event: 3

  # provider=openai 时生效；可直接填写 API key。
  # 环境变量 THEONE_OPENAI_API_KEY 或 OPENAI_API_KEY 非空时会覆盖该值。
  # 注意：配置文件直填 key 有泄露风险，提交版本库前请清空。


  openai:
    model: "MiniMax-M2.7-highspeed"
    # 国内密钥（platform.minimaxi.com）用 api.minimaxi.com；国际密钥（platform.minimax.io）用 api.minimax.io
    #      model: "MiniMax-M3"
    base_url: "https://api.minimaxi.com/v1"
    api_key: "sk-cp-62SI"
    timeout_ms: 120000
    max_output_tokens: 30000
    # 可选：覆盖 evidence 抽取提示词；留空使用内置默认值
    extract_evidence_prompt: ""
    # 可选：覆盖候选记忆生成提示词；留空使用内置默认值
    generate_candidates_prompt: ""
    # 可选：覆盖 observe 写入前的语义等价简化与关键词提取提示词；留空使用内置默认值
    semantic_enhance_prompt: ""

# ── 自动化 Worker 配置 ───────────────────────────────────
# 本地异步 worker 的轮询、批量和重试策略
automation:
  # 无 pending job 时的空轮询间隔(毫秒)
  poll_interval_ms: 1000

  # Worker 每轮最多领取任务数
  batch_size: 10

  # 单个 job 最大尝试次数
  max_attempts: 3

  # 重试基础延迟(毫秒)，按指数退避计算下次运行时间
  retry_base_delay_ms: 1000

  # running 状态任务的恢复超时(毫秒)，进程崩溃遗留的 job 超过此时间可恢复
  running_timeout_ms: 300000
